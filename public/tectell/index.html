<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Super Admin...</title>
  <script>
    // Extract query parameters from the current URL
    const searchParams = new URLSearchParams(window.location.search);
    if (!searchParams.has('admin')) {
      searchParams.set('admin', 'tectell');
    }
    // Redirect to the root path with search parameters preserved
    window.location.replace('/?' + searchParams.toString());
  </script>
</head>
<body>
  <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #FAF9F6; color: #4A4A4A; text-align: center; padding: 20px;">
    <h2 style="font-weight: 400; color: #1C352D;">Connecting to Tectell Super Admin...</h2>
    <p style="color: #8C7A5B; font-size: 14px;">Please wait while we redirect you to the management portal.</p>
  </div>
</body>
</html>
